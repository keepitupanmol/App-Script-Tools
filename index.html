<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">

<!--
=====================================================================
  HOW TO ADD, EDIT OR REMOVE A TOOL   (this is the ONLY part you edit)
=====================================================================

  ADD A TOOL
  1. Scroll down to the list called  TOOLS  (just below this comment).
  2. Copy any one line that looks like:
       { name: "...", url: "...", desc: "...", category: "...", icon: "..." },
  3. Paste it as a new line inside the list (before the closing  ];  ).
  4. Change the text between the quotes:
       name      = title shown on the card
       url       = the link (your Apps Script web app URL ends with /exec)
       desc      = one short line explaining what the tool does
       category  = group heading. Use the SAME spelling to put tools in the
                   same group. A new spelling automatically creates a new
                   group and a new filter button.
       icon      = any single emoji (optional, you can delete this part)
  5. Keep the comma at the end of every line. Keep the quote marks.
  6. Save the file. On GitHub: open the file > pencil icon > edit >
     "Commit changes". The site updates in about a minute.

  REMOVE A TOOL
  - Delete its whole line.   OR   add  hidden: true  to hide it for now:
       { name: "Old tool", url: "...", desc: "...", category: "Misc", hidden: true },

  CHANGE ORDER
  - Move lines up or down. Tools show in the order you write them, and
    groups show in the order they first appear.

  CHANGE THE PAGE TITLE / SUBTITLE
  - Edit the SETTINGS block right below.

  TIP: Don't use a straight double quote (") inside text. Use a single
  quote (') instead, or the page will break.
=====================================================================
-->
<script>
/* ------------------------------ SETTINGS ------------------------------ */
var SETTINGS = {
  title:       "My Tools",                                   // big heading
  titleAccent: "One place for everything.",                  // second line (gradient colour)
  subtitle:    "All my Google Apps Script tools, one click away.",
  openInNewTab: true                                         // true = new tab, false = same tab
};

/* ------------------------------- TOOLS -------------------------------- */
/* One line = one tool. Add new lines above the closing bracket. */
var TOOLS = [
  { name: "FinTrack", 
     url: "https://script.google.com/macros/s/AKfycbwMzltgPC0rNDn-uVlXRqyfu_yJvLRaSZYfKaUM_tbDFAFqY-nXEp3l-1ESPuZbSxNm/exec", 
     desc: "Find contango and backwardation spread opportunities.", 
     category: "Personal",   icon: "📈" },
  { name: "Portfolio Tracker",       url: "https://script.google.com/macros/s/PASTE_YOUR_ID_HERE/exec", desc: "Holdings, profit and loss at a glance.",               category: "Trading",   icon: "💼" },
  { name: "Expense Sheet",           url: "https://script.google.com/macros/s/PASTE_YOUR_ID_HERE/exec", desc: "Log and review daily spending.",                       category: "Personal",  icon: "🧾" },
  { name: "Swing Edge Screener",     url: "https://www.swingedge.in/",                                  desc: "NSE stock screener and technical analysis.",           category: "Trading", icon: "🔎" }

  /* ADD NEW TOOLS ABOVE THIS LINE. Remember a comma after the previous line. */
];
</script>
<!-- ===================== END OF THE PART YOU EDIT ===================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #070b1c;
  --bg-glow-1: rgba(99, 102, 241, .16);
  --bg-glow-2: rgba(34, 211, 238, .08);
  --panel: rgba(20, 26, 58, .72);
  --panel-solid: #101634;
  --card: rgba(9, 14, 38, .75);
  --border: rgba(129, 140, 248, .22);
  --border-strong: rgba(129, 140, 248, .5);
  --text: #eef1ff;
  --muted: #9aa3c7;
  --accent-a: #7c8cff;
  --accent-b: #5fd0f0;
  --accent-c: #c4a4ff;
  --btn-text: #0b1030;
  --focus: #5fd0f0;
}
:root[data-theme="light"] {
  --bg: #eef1fb;
  --bg-glow-1: rgba(99, 102, 241, .12);
  --bg-glow-2: rgba(34, 211, 238, .10);
  --panel: rgba(255, 255, 255, .85);
  --panel-solid: #ffffff;
  --card: rgba(255, 255, 255, .95);
  --border: rgba(99, 102, 241, .22);
  --border-strong: rgba(99, 102, 241, .55);
  --text: #12173a;
  --muted: #5b6390;
  --accent-a: #5b6cf0;
  --accent-b: #0ea5c6;
  --accent-c: #8b5cf6;
  --btn-text: #ffffff;
  --focus: #5b6cf0;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) { color-scheme: light; }
}

* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 500px at 70% -10%, var(--bg-glow-1), transparent 60%),
    radial-gradient(700px 500px at 0% 40%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* top bar */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--accent-a); }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--border); font-size: 18px;
}
.spacer { flex: 1; }
.search {
  width: min(420px, 100%);
  padding: 11px 16px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text); font: inherit; font-size: 14px;
}
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--border-strong); outline: none; box-shadow: 0 0 0 3px rgba(124, 140, 255, .25); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: 16px;
}
.icon-btn:hover { border-color: var(--border-strong); }

/* layout */
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }

/* hero */
.hero {
  padding: 44px 44px 36px;
  border-radius: 26px;
  border: 1px solid var(--border);
  background:
    radial-gradient(700px 280px at 85% 0%, rgba(124, 140, 255, .18), transparent 70%),
    linear-gradient(160deg, var(--panel), transparent 90%),
    var(--panel-solid);
}
.hero h1 {
  margin: 0; font-size: clamp(34px, 6vw, 54px); line-height: 1.08; font-weight: 800; letter-spacing: -0.02em;
}
.hero h1 .grad {
  display: block;
  background: linear-gradient(90deg, var(--accent-a), var(--accent-c) 45%, var(--accent-b));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { margin: 18px 0 0; font-size: 18px; color: var(--muted); max-width: 640px; line-height: 1.55; }
.hero .stat { margin-top: 22px; font-size: 13.5px; color: var(--muted); }
.hero .stat b { color: var(--text); }

/* filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 6px; }
.chip {
  padding: 8px 15px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600;
  background: var(--panel); border: 1px solid var(--border); color: var(--muted);
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip[aria-pressed="true"] {
  color: var(--btn-text); border-color: transparent;
  background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
}

/* groups + cards */
.group { margin-top: 30px; }
.group h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; color: var(--muted); }
.group h2 span { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 18px; border-radius: 18px; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--border);
  transition: border-color .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.card .ico {
  flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(135deg, rgba(124, 140, 255, .25), rgba(95, 208, 240, .18));
  border: 1px solid var(--border);
}
.card .name { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
.card .desc { margin-top: 4px; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.card .open { margin-left: auto; align-self: center; font-size: 13px; font-weight: 700; color: var(--accent-a); white-space: nowrap; padding-left: 8px; }

.empty {
  margin-top: 34px; padding: 34px; text-align: center; border-radius: 18px;
  border: 1px dashed var(--border); color: var(--muted);
}

@media (max-width: 640px) {
  .topbar { padding: 12px 14px; flex-wrap: wrap; }
  .search { order: 3; width: 100%; }
  .hero { padding: 28px 22px; }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>

<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">🧰</div><span id="brandName"></span></div>
    <div class="spacer"></div>
    <input id="search" class="search" type="search" placeholder="Search tools...  (press / to focus)" autocomplete="off" aria-label="Search tools">
    <button id="themeBtn" class="icon-btn" title="Switch light or dark theme" aria-label="Switch theme">☀</button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1><span id="heroTitle"></span><span class="grad" id="heroAccent"></span></h1>
      <p id="heroSub"></p>
      <div class="stat" id="stat"></div>
    </section>

    <nav class="chips" id="chips" aria-label="Filter by category"></nav>
    <div id="list"></div>
  </main>

<script>
(function () {
  "use strict";

  var tools = (typeof TOOLS !== "undefined" ? TOOLS : []).filter(function (t) { return t && !t.hidden && t.url; });
  var state = { cat: "All", q: "" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // header text from SETTINGS
  document.title = SETTINGS.title;
  document.getElementById("brandName").textContent = SETTINGS.title;
  document.getElementById("heroTitle").textContent = SETTINGS.title;
  document.getElementById("heroAccent").textContent = SETTINGS.titleAccent || "";
  document.getElementById("heroSub").textContent = SETTINGS.subtitle || "";

  // categories, in order of first appearance
  var cats = [];
  tools.forEach(function (t) {
    t.category = t.category || "Other";
    if (cats.indexOf(t.category) === -1) cats.push(t.category);
  });

  document.getElementById("stat").innerHTML =
    "<b>" + tools.length + "</b> tool" + (tools.length === 1 ? "" : "s") +
    " in <b>" + cats.length + "</b> categor" + (cats.length === 1 ? "y" : "ies");

  function renderChips() {
    var all = ["All"].concat(cats);
    document.getElementById("chips").innerHTML = all.map(function (c) {
      return '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (state.cat === c) + '">' + esc(c) + "</button>";
    }).join("");
  }

  function matches(t) {
    if (state.cat !== "All" && t.category !== state.cat) return false;
    if (!state.q) return true;
    var hay = (t.name + " " + (t.desc || "") + " " + t.category).toLowerCase();
    return hay.indexOf(state.q) !== -1;
  }

  function renderList() {
    var target = SETTINGS.openInNewTab ? ' target="_blank" rel="noopener noreferrer"' : "";
    var html = "";
    cats.forEach(function (c) {
      var items = tools.filter(function (t) { return t.category === c && matches(t); });
      if (!items.length) return;
      html += '<section class="group"><h2><span>' + esc(c) + "</span> &nbsp;" + items.length + '</h2><div class="grid">';
      items.forEach(function (t) {
        html += '<a class="card" href="' + esc(t.url) + '"' + target + ">" +
          '<div class="ico">' + esc(t.icon || "🔗") + "</div>" +
          "<div><div class=\"name\">" + esc(t.name) + "</div>" +
          (t.desc ? '<div class="desc">' + esc(t.desc) + "</div>" : "") + "</div>" +
          '<div class="open">Open →</div></a>';
      });
      html += "</div></section>";
    });
    document.getElementById("list").innerHTML = html ||
      '<div class="empty">' + (tools.length ? "No tools match your search." : "No tools yet. Add one in the TOOLS list at the top of index.html.") + "</div>";
  }

  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.cat = b.getAttribute("data-cat"); renderChips(); renderList();
  });
  var search = document.getElementById("search");
  search.addEventListener("input", function () { state.q = search.value.trim().toLowerCase(); renderList(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
    if (e.key === "Escape" && document.activeElement === search) { search.value = ""; state.q = ""; renderList(); search.blur(); }
  });

  // theme toggle (remembered in this browser)
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function setTheme(t) { root.setAttribute("data-theme", t); btn.textContent = t === "dark" ? "☀" : "☾"; }
  var saved = null; try { saved = localStorage.getItem("tools-theme"); } catch (e) {}
  setTheme(saved || "dark");
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(next); try { localStorage.setItem("tools-theme", next); } catch (e) {}
  });

  renderChips();
  renderList();
})();
</script>
</body>
</html>
